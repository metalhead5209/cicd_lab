# node_install.yml
- name: Install Node.js 22.x on ctrl1 (NodeSource nodistro fix)
  hosts: ctrl1
  become: true
  gather_facts: true

  vars:
    node_major_version: "22"   # change to "20" if you want Node 20.x

  environment:
    DEBIAN_FRONTEND: noninteractive

  tasks:
    - name: Ensure keyrings dir exists at /usr/share/keyrings
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: Install prerequisites for external repos
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
        state: present
        update_cache: yes
        lock_timeout: 60

    - name: Remove any legacy NodeSource list or key (cleanup)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/nodesource.list
        - /etc/apt/keyrings/nodesource.gpg
        - /etc/apt/keyrings/nodesource.asc
        - /usr/share/keyrings/nodesource.gpg

    - name: Install NodeSource keyring to /usr/share/keyrings (dearmored)
      ansible.builtin.shell: |
        set -eu pipefail
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
        | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
        chmod 0644 /usr/share/keyrings/nodesource.gpg
      args:
        creates: /usr/share/keyrings/nodesource.gpg

    - name: Add NodeSource repository for Node.js {{ node_major_version }}.x (nodistro)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major_version }}.x nodistro main"
        state: present
        filename: nodesource

    - name: Clean and refresh apt cache
      ansible.builtin.shell: |
        set -e
        apt-get clean
        rm -rf /var/lib/apt/lists/*
        apt-get update

    - name: Install Node.js (includes npm)
      ansible.builtin.apt:
        name: nodejs
        state: present
        lock_timeout: 60

    - name: Verify Node.js and npm versions
      ansible.builtin.shell: |
        set -e
        echo "node: $(node -v)"
        echo "npm:  $(npm -v)"
      register: node_npm_versions
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ node_npm_versions.stdout_lines }}"
